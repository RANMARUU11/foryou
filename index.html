<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Terminal - Restricted Access</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41; /* Warna hijau khas terminal */
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            font-size: 16px;
            line-height: 1.5;
        }
        #console {
            white-space: pre-wrap;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            margin-right: 10px;
        }
        input {
            background: transparent;
            border: none;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
            width: 100%;
        }
        .hidden { display: none !important; }
        .typing { border-right: 10px solid #00ff41; animation: blink 1s step-end infinite; }
        
        @keyframes blink {
            50% { border-color: transparent; }
        }
    </style>
</head>
<body>

    <div id="console"></div>
    <div class="input-line hidden" id="input-container">
        <span class="prompt">root@system:~$</span>
        <input type="text" id="user-input" autocomplete="off">
    </div>

    <script>
        // --- BAGIAN YANG BISA KAMU EDIT ---
        const targetName = "Ayu Kholilah";

        function normalizeName(value) {
            return (value || "")
                .toLowerCase()
                .normalize("NFC")
                .replace(/[^a-z]/g, "")
                .trim();
        }

        function levenshteinDistance(a, b) {
            const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));

            for (let i = 0; i <= a.length; i++) dp[i][0] = i;
            for (let j = 0; j <= b.length; j++) dp[0][j] = j;

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    dp[i][j] = Math.min(
                        dp[i - 1][j] + 1,
                        dp[i][j - 1] + 1,
                        dp[i - 1][j - 1] + cost
                    );
                }
            }

            return dp[a.length][b.length];
        }

        function isCloseToTargetName(input) {
            const normalizedInput = normalizeName(input);
            const normalizedTarget = normalizeName(targetName);

            if (!normalizedInput) return false;
            if (normalizedInput === normalizedTarget) return true;

            const distance = levenshteinDistance(normalizedInput, normalizedTarget);
            const maxAllowedDistance = Math.max(2, Math.ceil(normalizedTarget.length * 0.2));

            return distance <= maxAllowedDistance;
        }

        // ----------------------------------

        const consoleDiv = document.getElementById('console');
        const inputContainer = document.getElementById('input-container');
        const userInput = document.getElementById('user-input');

        const bootSequence = [
            "Initializing system boot...",
            "Loading kernel modules... [OK]",
            "Mounting file systems... [OK]",
            "Establishing secure connection to server... [OK]",
            "Bypassing firewall... [DONE]",
            " ",
            "SYSTEM READY.",
            "Masukkan nama orang paling spesial hari ini:"
        ];

        let i = 0;

        // Fungsi bantu untuk auto-scroll mengikuti teks yang sedang tampil
        function scrollToBottom() {
            window.scrollTo(0, document.body.scrollHeight);
        }

        // Fungsi untuk mengetik teks seperti hacker
        function typeWriter(text, index, callback, speed = 30) {
            consoleDiv.classList.add('typing');
            if (index < text.length) {
                consoleDiv.innerHTML += text.charAt(index);
                scrollToBottom();
                setTimeout(() => typeWriter(text, index + 1, callback, speed), speed);
            } else {
                consoleDiv.classList.remove('typing');
                consoleDiv.innerHTML += "<br>";
                scrollToBottom();
                if (callback) callback();
            }
        }

        // Fungsi untuk menjalankan urutan booting
        function runBootSequence() {
            if (i < bootSequence.length) {
                typeWriter(bootSequence[i], 0, runBootSequence, 20);
                i++;
            } else {
                inputContainer.classList.remove('hidden');
                userInput.focus();
            }
        }

        // Memulai sistem saat web dibuka
        window.onload = () => {
            setTimeout(runBootSequence, 500);
        };

        // Menangkap input dari user
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                const name = userInput.value.trim();
                inputContainer.classList.add('hidden');

                // Menampilkan apa yang diinput user
                consoleDiv.innerHTML += `<span class="prompt">root@system:~$</span> ${name}<br><br>`;
                scrollToBottom();

                typeWriter("Analyzing input database...", 0, () => {
                    setTimeout(() => {
                        consoleDiv.innerHTML += "Memverifikasi identitas...<br>";
                        scrollToBottom();
                        setTimeout(() => {
                            if (isCloseToTargetName(name)) {
                                consoleDiv.innerHTML += "<span style='color: #fff;'>[ ACCESS GRANTED ]</span><br><br>";
                                scrollToBottom();
                                setTimeout(() => {
                                    consoleDiv.innerHTML += "Mendekripsi pesan rahasia...<br><br>";
                                    scrollToBottom();
                                    // Menampilkan pesan utama yang romantis dengan efek ngetik pelan
                                    typeWriter(sweetMessage, 0, null, 50);
                                }, 1000);
                            } else {
                                consoleDiv.innerHTML += "<span style='color: #ff4d4d;'>[ ACCESS DENIED ] Nama tidak valid. Coba: Ayu Kholilah</span><br><br>";
                                scrollToBottom();
                                setTimeout(() => {
                                    userInput.value = "";
                                    inputContainer.classList.remove('hidden');
                                    userInput.focus();
                                }, 1500);
                            }
                        }, 1500);
                    }, 1000);
                }, 30);
            }
        });

        // Supaya kalau user klik di mana aja, otomatis fokus ke input lagi
        document.body.addEventListener('click', () => {
            if (!inputContainer.classList.contains('hidden')) {
                userInput.focus();
            }
        });
    </script>
</body>
